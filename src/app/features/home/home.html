<main class="flex min-h-screen items-center justify-center bg-page p-6">
    <section class="w-full max-w-xl rounded-2xl bg-white p-8 shadow-sm">
        <h1 class="text-3xl font-semibold text-slate-900">
            Frontend Assignment
        </h1>

        <p class="mt-3 text-slate-600">
            Select a task to get started.
        </p>

        @defer (on viewport) {
        <div class="mt-8 grid gap-4 sm:grid-cols-2">
            <a routerLink="/task-1" class="rounded-xl border border-brand px-6 py-4 text-center
               font-medium text-brand transition hover:bg-page
               focus-visible:outline-2 focus-visible:outline-offset-4
               focus-visible:outline-brand">
                Task 1 — Message Composer
            </a>

            <a routerLink="/task-2" class="rounded-xl border border-brand px-6 py-4 text-center
               font-medium text-brand transition hover:bg-page
               focus-visible:outline-2 focus-visible:outline-offset-4
               focus-visible:outline-brand">
                Task 2 — Contact Management
            </a>
        </div>
        } @placeholder {
        <div class="mt-8 flex h-16 w-full animate-pulse rounded-xl bg-slate-100"></div>
        }
    </section>
</main>
